<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14110e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="受 ARC Raiders 啟發的單人網頁版撤離射擊遊戲：整備、空降、搜刮、對抗 ARC 機器人與 AI 掠手，並在時間內撤離。">
  <title>ARC Raiders 網頁版 · 搜打撤</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game3d"></canvas>
  <canvas id="game"></canvas>
  <div id="lockHint" style="display:none">🖱️ 點擊畫面繼續（鎖定滑鼠視角）</div>

  <!-- 遠征 HUD -->
  <div id="hud" class="hidden">
    <div id="hudTL">
      <div class="bar"><div class="lbl">❤</div><div class="track"><div id="hpFill" class="fill hp"></div></div><span id="hpTxt">100</span></div>
      <div class="bar"><div class="lbl">🛡</div><div class="track"><div id="shFill" class="fill sh"></div></div><span id="shTxt">0</span></div>
      <div class="bar thin"><div class="lbl">⚡</div><div class="track"><div id="stFill" class="fill st"></div></div></div>
      <div id="weapon"><div id="wName"></div><div id="wAmmo"></div><div id="wAlt"></div></div>
      <div id="feed"></div>
    </div>
    <div id="hudTC">
      <div id="timer">7:00</div>
      <div id="objective"></div>
    </div>
    <div id="hudTR">
      <canvas id="minimap" width="150" height="150"></canvas>
      <div class="hudBtns">
        <button class="hb" data-act="map" title="地圖 (M)">🗺</button>
        <button class="hb" data-act="bag" title="背包 (Tab)">🎒</button>
        <button class="hb" data-act="esc" title="暫停 (Esc)">⏸</button>
      </div>
    </div>
    <div id="prompt"></div>
    <div id="extractBar"></div>
    <div id="banner"></div>
    <div id="hurt"></div>
    <div id="fps"></div>
    <div id="keysHelp">WASD 移動 · 滑鼠轉視角 · 左鍵射擊 · Shift 衝刺 · Z 蹲下 · 空白鍵 閃避 · E 互動 · R 換彈 · Q 換槍 · H 治療 · C 護盾 · G 手雷 · Tab 背包 · M 地圖</div>
  </div>

  <!-- 觸控 -->
  <div id="touchZone" class="hidden"></div>
  <div id="stickL" class="stick"><div class="knob"></div></div>
  <div id="stickR" class="stick aim"><div class="knob"></div></div>
  <button id="fireBtn" class="hidden">🔥<small>開火</small></button>
  <div id="ctrlHint" class="hidden"></div>
  <div id="touchBtns" class="hidden">
    <button class="tb big" id="btnInteract" data-act="interact">✋<small>互動</small></button>
    <button class="tb" data-act="reload">🔄<small>換彈</small></button>
    <button class="tb" data-act="swap">🔫<small>換槍</small></button>
    <button class="tb" data-act="heal">🩹<small id="cntHeal">0</small></button>
    <button class="tb" data-act="shield">🔷<small id="cntShield">0</small></button>
    <button class="tb" data-act="grenade">💣<small id="cntGren">0</small></button>
    <button class="tb" id="btnCrouch" data-act="crouch">🧎<small>蹲下</small></button>
    <button class="tb" data-act="dodge">💨<small>閃避</small></button>
  </div>

  <!-- 遠征中的背包/搜刮面板 -->
  <div id="panel" class="hidden"></div>

  <!-- 基地 -->
  <div id="base" class="hidden">
    <header id="baseHead"></header>
    <nav id="tabs"></nav>
    <main id="baseBody"></main>
  </div>

  <!-- 標題畫面 -->
  <div id="title">
    <div class="tWrap">
      <div class="logo">ARC <span>RAIDERS</span></div>
      <div class="sub">網頁版 · 單人搜打撤</div>
      <p class="tdesc">ARC 機器摧毀了地表。身為掠手，你要從地下城市斯佩蘭薩出發，搜刮物資、對抗 ARC 與其他掠手，並在時限內搭上撤離電梯。死亡會失去身上所有未放進安全口袋的物品。</p>
      <button id="btnStart" class="btn primary big">進入斯佩蘭薩</button>
      <div class="tnote">手機請橫向遊玩效果最佳 · 進度自動存在此瀏覽器</div>
    </div>
  </div>

  <div id="modal" class="hidden"><div id="modalBox"></div></div>
  <div id="toast"></div>
  <div id="rotate">📱↻ 建議將手機轉為橫向</div>

  <script src="js/data.js"></script>
  <script src="js/save.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/world.js"></script>
  <script src="js/vendor/three.min.js"></script>
  <script src="js/render3d.js"></script>
  <script src="js/raid.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
